[package]
name = "cockatiel-test-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "dbe1f30af7667cd4a25990bd0254501174bc843a" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v7", "fast-rng"] }

[[bin]]
name = "cockatiel-test-runner"
path = "src/main.rs"