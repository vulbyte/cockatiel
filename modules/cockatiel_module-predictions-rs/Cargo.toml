[package]
name = "cockatiel_prediction"
version = "0.1.0"
edition = "2021"
description = "Cockatiel module — zero-sum chat predictions: !pred start/stop/bet, parimutuel payouts, live bar window"
license = "GPL-2.0"

[[bin]]
name = "prediction_brain"
path = "src/bin/prediction_brain.rs"

[[bin]]
name = "prediction_display"
path = "src/bin/prediction_display.rs"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "184ccbcc049e74701ed8cbf1ec1997a60c8cfdf3" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"