[package]
name = "cockatiel-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cockatiel"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ruzstd = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

[dev-dependencies]
zstd = "0.13"

[workspace]
