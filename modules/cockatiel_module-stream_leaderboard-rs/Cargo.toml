[workspace]

[package]
name = "cockatiel-stream-leaderboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cockatiel-stream-leaderboard"
path = "src/main.rs"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "16120ab927d35c14baf059d5be7d5c6bb37d78bc" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v7"] }
tracing = "0.1"
