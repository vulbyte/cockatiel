[package]
name = "banned_words_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { path = "../../cockatiel_engine-rs/cockatiel_lib/rust" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7"] }