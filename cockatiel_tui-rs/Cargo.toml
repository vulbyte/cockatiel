[package]
name = "cockatiel-tui"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "1dae41ef48682fb1af0e230531842043791eb709" }
ratatui = "0.29"
crossterm = "0.28"
tokio-tungstenite = "0.24"
futures-util = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["full"] }
open = "5"
