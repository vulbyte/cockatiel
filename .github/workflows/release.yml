name: release

# Build, package, gate (doctor), and publish the Cockatiel core components.
#
# The heavy lifting lives in scripts/ so it is runnable locally and testable:
#   scripts/package-release.sh <version> <out-dir>   build + archive + checksum
#   scripts/doctor-gate.sh                           real engine+user-db+suites
#   scripts/merge-manifests.py <dist-dir>            fold platform assets back
#
# Publishing is PER COMPONENT REPO (engine/tui have their own repos; user-db and
# test-runner ship from this monorepo). It needs a token that can write to every
# component repo: set the `RELEASE_TOKEN` secret (a PAT with `repo` scope).
#
# NOTE (maintainer): the checked-in `release.assets` maps are updated by
# `merge-manifests.py`, which writes the working tree. Committing those into the
# submodule repos and bumping the monorepo gitlinks is left as an explicit,
# reviewable step rather than an automatic push from CI (see the final step).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Build, package and verify only — do NOT publish releases"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  package:
    name: package ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runner: ubuntu-latest,         deps: linux }
          - { os: linux,   arch: aarch64, runner: ubuntu-24.04-arm,       deps: linux }
          - { os: windows, arch: x86_64,  runner: windows-latest,         deps: windows }
          - { os: windows, arch: aarch64, runner: windows-11-vs2026-arm,  deps: windows }
          - { os: macos,   arch: aarch64, runner: macos-15,               deps: macos }
          # macOS x86_64: cross-compile on the arm64 runner and verify under
          # Rosetta (GitHub retired hosted Intel runners). Add once the cross
          # toolchain step is in place:
          #   - { os: macos, arch: x86_64, runner: macos-15, deps: macos, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: matrix.deps == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libasound2-dev libxdo-dev

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Build + package core
        shell: bash
        run: scripts/package-release.sh "${{ steps.ver.outputs.version }}" dist

      - name: Doctor gate (real engine + user-db + compliance suites)
        shell: bash
        run: scripts/doctor-gate.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    if: ${{ !inputs.dry_run }}
    needs: [package, package-macos-x64, package-windows-i686, package-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      # Union every platform's asset entry into the checked-in manifests. This
      # is what makes the launcher find (and checksum-verify) each archive.
      - name: Merge per-platform manifests
        run: python3 scripts/merge-manifests.py dist

      - name: Publish per-component releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          tag="v$version"
          declare -A REPO=(
            [engine]=vulbyte/cockatiel_engine-rs
            [tui]=vulbyte/cockatiel_tui_v2-rs
            [user-db]=vulbyte/cockatiel
            [cockatiel-test-runner]=vulbyte/cockatiel
          )
          for name in "${!REPO[@]}"; do
            repo="${REPO[$name]}"
            gh release view "$tag" --repo "$repo" >/dev/null 2>&1 \
              || gh release create "$tag" --repo "$repo" --title "Cockatiel $version" --notes "Automated release $version"
            shopt -s nullglob
            files=(dist/${name}-*)
            if [ ${#files[@]} -eq 0 ]; then
              echo "warning: no archives for $name" >&2
              continue
            fi
            gh release upload "$tag" --repo "$repo" --clobber "${files[@]}"
          done

      # The merged manifests are in the working tree. Upload them so the
      # maintainer (or a follow-up PR job) can fold them into the component
      # repos and bump the monorepo gitlinks. Doing that automatically from CI
      # would push to every submodule repo, so it stays a reviewed step.
      - uses: actions/upload-artifact@v4
        with:
          name: merged-manifests
          path: |
            cockatiel_engine-rs/cockatiel_module_info.json
            cockatiel_tui_v2-rs/cockatiel_module_info.json
            cockatiel_user_database-rs/cockatiel_module_info.json
            cockatiel_test_runner-rs/cockatiel_module_info.json

  # macOS x86_64: GitHub retired hosted Intel runners, so cross-compile on the
  # arm64 runner and run the binaries under Rosetta 2 to verify them.
  package-macos-x64:
    name: package macos-x86_64 (cross + Rosetta)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - id: ver
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: Build + package x86_64
        shell: bash
        env:
          COCKATIEL_BUILD_TARGET: x86_64-apple-darwin
        run: scripts/package-release.sh "${{ steps.ver.outputs.version }}" dist-x64
      - name: Install x86_64 + doctor (Rosetta)
        shell: bash
        run: |
          set -euo pipefail
          launcher="cockatiel_launcher-rs/target/release/cockatiel"
          version="${{ steps.ver.outputs.version }}"
          # The resolver fetches <base>/<tag>/<file>; mirror the release layout.
          mkdir -p "dist-x64/v$version"
          cp dist-x64/*.tar.gz dist-x64/v$version/
          root="$RUNNER_TEMP/root-x64"
          "$launcher" install --lock cockatiel.lock --repo-root . --root "$root" \
            --os macos --arch x86_64 --release-base "file://$PWD/dist-x64" \
            --component engine --component tui --component user-db --component test-runner
          "$launcher" doctor --root "$root" --quick --mode both
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-x86_64
          path: dist-x64/*
          if-no-files-found: error

  # Clean-room per-device verification: a fresh runner with NO rust-cache and no
  # prebuilt components builds only the launcher, then installs the PUBLISHED
  # release and runs doctor. This is what proves the shipped artifacts work.
  verify-installed:
    name: verify installed ${{ matrix.os }}-${{ matrix.arch }}
    if: ${{ !inputs.dry_run }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runner: ubuntu-latest }
          - { os: linux,   arch: aarch64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: x86_64,  runner: windows-latest }
          - { os: windows, arch: aarch64, runner: windows-11-vs2026-arm }
          - { os: macos,   arch: aarch64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - id: ver
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: Install from published release + doctor
        shell: bash
        run: scripts/verify-installed.sh "${{ steps.ver.outputs.version }}"

  # Linux armv7 (32-bit) is NOT buildable: turso_core (the timeline DB) takes a
  # mandatory `io-uring` dependency on every Linux target, and the io-uring crate
  # only supports x86_64/aarch64. Until turso supports armv7 (or we swap the DB),
  # 32-bit Linux cannot ship. Windows i686 (below) is unaffected.

  # Windows i686 (32-bit): native build; aws-lc's x86 assembly needs NASM.
  package-windows-i686:
    name: package windows-i686
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Install NASM
        run: choco install nasm -y
      - id: ver
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: Build + package i686
        shell: bash
        env:
          COCKATIEL_BUILD_TARGET: i686-pc-windows-msvc
        run: scripts/package-release.sh "${{ steps.ver.outputs.version }}" dist-i686
      - name: Install + doctor (WoW64)
        shell: bash
        run: |
          set -euo pipefail
          launcher="cockatiel_launcher-rs/target/release/cockatiel"
          version="${{ steps.ver.outputs.version }}"
          mkdir -p "dist-i686/v$version"
          cp dist-i686/*.zip "dist-i686/v$version/"
          # Git Bash `pwd -W` gives a native D:/ path for the file:// URL.
          base="file:///$(pwd -W)/dist-i686"
          root="$RUNNER_TEMP/root-i686"
          "$launcher" install --lock cockatiel.lock --repo-root . --root "$root" \
            --os windows --arch x86 --release-base "$base" \
            --component engine --component user-db --component test-runner
          "$launcher" doctor --root "$root" --quick --mode both
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-i686
          path: dist-i686/*
          if-no-files-found: error

  # Every Rust module, per platform. tts-rs is skipped on 32-bit (sherpa-onnx
  # ships no 32-bit prebuilt); Python-only modules are skipped by the script.
  package-modules:
    name: package modules ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,  runner: ubuntu-latest }
          - { os: linux,   arch: aarch64, runner: ubuntu-24.04-arm }
          - { os: macos,   arch: aarch64, runner: macos-15 }
          - { os: windows, arch: x86_64,  runner: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux module deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libasound2-dev libxdo-dev
      - id: ver
        shell: bash
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
      - name: Build + package modules
        shell: bash
        run: scripts/package-modules.sh "${{ steps.ver.outputs.version }}" "dist-modules"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-modules-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-modules/*
          if-no-files-found: error
