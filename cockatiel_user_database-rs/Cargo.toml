[package]
name = "cockatiel-user-database"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-proto = { git = "https://github.com/vulbyte/cockatiel_proto", rev = "7df084933dc4a1b736b17348da7ade5df6104ead" }
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
turso = "0.1.0"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v7", "fast-rng"] }